<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <h2>兩數相加</h2>
    <script>
        function add(n1,n2){
            return n1+n2;
        }
        console.log(add(5,3));

        //匿名涵式

        let add2 = function(n1,n2){
            return n1+n2;
        }
        console.log(add2(10,8));

        //練習5
       pi = 3.14;
        let cir = function(pi,n4){
            //設為const(常數)，執行中的值不能更改，一但變更就會出錯
            return pi*n4*n4;
        }
        console.log(cir(3.14,3));


////////////////////////////////////////
        console.log("老師的作法:")
        let cirt = function(n4){
            const pi = 3.14;//設為const(常數)，執行中的值不能更改，一但變更就會出錯
            return pi*n4*n4;
        }
        console.log(cirt(3));
////////////////////////////////////////////


        console.log("箭頭涵式:")
        //箭頭涵式

          let cir2  = (n4)=>{
            const pi = 3.14;//設為const(常數)，執行中的值不能更改，一但變更就會出錯
            return pi*n4*n4;
        }
        console.log(cir(3.14,3));
        


    </script>
    
</body>
</html>
