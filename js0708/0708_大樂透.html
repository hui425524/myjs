        let num = [];

        function btnClick() {

            for (let i = 1; i <= 38; i++) {
                num.push(i);
            }
            //console.log(num);

            for (let i = num.length; i > 0; i--) {

                let j = Math.floor(Math.random() * (i + 1));
                [num[i], num[j]] = [num[j], num[i]];
            }

            console.log(num.slice(0,6));
            //用push放進新的陣列再去排序

            console.log(snum);

            // snum.sort((a,b)=>a-b)
            // console.log("遞減排序後=>>>>"+ snum);


            snum.sort((a, b) => {

                //遞減
                return a - b;
            });
            console.log("遞減排序後=>>>>" + snum);

            console.log("威力採第二區----------------");
            let n = Math.floor(Math.random() * 8 + 1);//陣列從0開始所以+1
            console.log("特別區 : " + n)
