<body>
    <script>
        console.log("filter=>傳回符合條件的元素")
        let arr1 = [1, 3, 7, 100, 1000];
        let arr2 = [];

        //把陣列中每個值*2
        console.log("方法一")
        for (let i = 0; i < arr1.length; i++) {

            arr2[i] = arr1[i] * 2;
        }
        console.log(arr2);

        console.log("方法二")

        let arr3 = arr1.map((n)=>{

            return n*2;
        })
         console.log(arr3);

        console.log("方法二縮減")
        //// 若程式只有一行可縮減成=>>>>

    </script>
