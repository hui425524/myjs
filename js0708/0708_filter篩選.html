<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        ///找出陣列中的奇數

        let arr1 = [1, 3, 7, 100, 234, 6];


        console.log("方法一");

        for (let i = 0; i < arr1.length; i++) {

            if (arr1[i] % 2 == 1) {

                console.log(arr1[i]);
            }

        }

        console.log("方法二");

        arr1.map((n) => {

            if (n % 2 == 1) {
                console.log(n);
            }

        });

        console.log("用filter找出陣列中>100的值");
   
        let arr6 = arr1.filter((n) => {
            if (n >= 100) {
                return true;
            }
        })
        console.log(arr6);
        
        /////簡化

        console.log("簡化");
   
        let arr7 = arr1.filter((n) => n >= 100) 
        console.log(arr7);





        ////////////////////////////////


        console.log("1");
        let arr2 = [];

        for (let i = 0; i < arr1.length; i++) {

            if (arr1[i] % 2 == 1) {

                arr2.push(arr1[i]);
            }

        }
        console.log(arr2);

        // console.log("方法二map=>>>此題目不適用");

        console.log("3");

        let arr3 = arr1.filter((n) => {
            if (n % 2 !== 0) {
                return true;
            }
        })
        console.log(arr3);
        
        ////簡寫

         console.log("簡寫3=>4");

        let arr4 = arr1.filter((n) => {
            
                return n % 2 !== 0;
            
        })
        console.log(arr4);

        ////再簡化

         console.log("簡寫4=>5");

        let arr5 = arr1.filter((n) => n % 2 !== 0)           
        console.log(arr5);


    </script>

</body>

</html>
