<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>兩數相加</h2>
    <script>

//無參數無回傳
        function add1(){
            let a=1;
            let b=0;
            console.log(a+b);
        }
        add1();

//無參數有回傳
        function add2(){

            let a=1;
            let b=2;
            return(a+b);

        }
        console.log(add2());


//有參數 無回傳

        function add3(a,b){

            console.log(a+b);

        }
        add3(3,2);

//有參數 有回傳

        function add4(a,b){

            return a+b;

        }
            
        let sum=add4(2,5);
        console.log(sum);
        





    </script>
    
</body>
</html>
