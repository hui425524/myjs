<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="counter">3</p>
    <button id="btn">計時</buttton>
    <button id="btn2" style="display:none;">重來</button>
    <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Quas, possimus?</p>
    <!-- p>lorem10(10個字)  假文-->
    <script>
        let counter =document.getElementById("counter");
        let iniCounter = parseInt(counter.innerText);

        let btn = document.getElementById("btn");
        let btn2 = document.getElementById("btn2");

        


        btn.addEventListener('click',function(){

            showTime();

        })

        btn2.addEventListener('click',function(){

           counter.innerText="3";///////
            showTime();

        })

    function showTime(){

            let interval;
            let curCounter = iniCounter;

            interval=setInterval(()=> {

                if(curCounter<=0){

                    counter.innerText="時間到";

                    btn.style.display ='none';
                    btn2.style.display='block';//出現

                    return clearInterval(interval);
                }

                curCounter-=1;
                counter.innerText=curCounter;
            },1000)


        }






    </script>



</body>
</html>
