<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>還沒寫好</title>
</head>

<body>

    <p id="result">請重整網頁</p>

    <script>
       min = 1;
let max = 100;
const answer = Math.floor(Math.random() * (max - min - 1)) + min + 1;
let guess;
let count = 0;

console.log("終極密碼遊戲開始！");
console.log("請猜一個 1 到 100 的整數");

do {
  let input = prompt(`請輸入一個在 ${min} 到 ${max} 之間的數字：`);
  guess = parseInt(input);
  count++;

  if (isNaN(guess)) {
    alert("請輸入有效數字！");
    continue;
  }

  if (guess <= min || guess >= max) {
    alert(`請輸入 ${min} 和 ${max} 之間的數字`);
    continue;
  }

  if (guess < answer) {
    alert(`第${count}次：${guess} => 太小了（提示：${guess} - ${max}）`);
    min = guess;
  } else if (guess > answer) {
    alert(`第${count}次：${guess} => 太大了（提示：${min} - ${guess}）`);
    max = guess;
  } else {
    alert(`🎉 第${count}次：${guess} => 猜對了！答案是 ${answer}`);
  }

} while (guess !== answer);


        


    </script>
</body>

</html>
