<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        arr1 = [5, 60, 3, 90, 33, 1, 100];
        let max =arr1[0];
        let min=arr1[0];
        //////////////////老師教的方法
        console.log("------------1-----------:for");
        
        for (let i = 0; i < arr1.length; i++) {

            //檢查是否比目前的大
            if (arr1[i] > max) {
                max = arr1[i];
            } else if (arr1[i] < min) {
                min = arr1[i];

            }
        }
        console.log(`max:${max},min:${min}`);



        console.log("------------2-----------:for...of");
        max = arr1[0];
        min = arr1[0];

        for (let n of arr1) {

            if (n > max) {
                max = n;
            } else if (n < min) {
                min = n;
            }

        }
         console.log(`max:${max},min:${min}`);



        console.log("------------3-----------:forEach");
        max = arr1[0];
        min = arr1[0];

        arr1.forEach((n)=>{

            if (n > max) {
                max = n;
            } else if (n < min) {
                min = n;
            }


        })
        console.log(`max:${max},min:${min}`);


        console.log("------------4-----------:map");
        max = arr1[0];
        min = arr1[0];
        arr1.map((n)=> {

            if (n > max) {
                max = n;
            } else if (n < min) {
                min = n;
            }


        })       
        console.log(`max:${max},min:${min}`);

        //sort

        arr1.sort((a,b)=>{
            return a-b;

        });
        console.log(arr1);
        console.log(`max=${arr1[arr1.length-1]},min=${arr1[0]}`);


        //數學類別 Math.max(最大值)
        console.log("--------數學方法--:Math.max(最大值);Math.min(最小值)");
        max=Math.max(...arr1);
        min=Math.min(...arr1);
        console.log(`max:${max},min:${min}`);

    </script>
    
</body>
</html>
