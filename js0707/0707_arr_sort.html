<body>

    <h2>陣列常用法</h2>

    <script>

        //使用迴圈，顯示陣列中的內容

        let arr1 = [1,30,25];
        console.log("排序前:"+arr1);
        //遞增排序
        //箭頭函式寫法(可以直接回傳)
        arr1.sort((a,b)=>{
            //遞增
            return a-b;
            //遞減
            //return b-a;
        });

        console.log("遞增排序後=>>>>"+arr1);

          arr1.sort((a,b)=>{
            
            //遞減
            return b-a;
        });
         console.log("遞減排序後=>>>>"+arr1);



        // for (let i = 0; i < arr1.length; i++) {

        //     console.log(arr1[i]);
        // }


    </script>
